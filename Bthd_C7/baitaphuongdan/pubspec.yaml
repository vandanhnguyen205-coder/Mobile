name: baitaphuongdan
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0          # Thư viện hiển thị bản đồ OSM
  latlong2: ^0.9.1              # Thư viện quản lý tọa độ LatLng
  geolocator: ^10.1.0           # Lấy vị trí hiện tại của thiết bị
  http: ^1.2.0                  # Gọi API tìm đường (OSRM)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
